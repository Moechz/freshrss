# ===========================================================================
# FreshRSS for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : freshrss/freshrss:1.31.0 (Docker Hub, used unmodified)
#                  -> https://github.com/FreshRSS/FreshRSS
#                  OCI index digest
#                  sha256:31b0acfcb8e11600aa6ce697ff8d9d7ea620c85d766e5e764f487b433d20d066
#                  (linux/amd64 + linux/arm64 + linux/arm/v7)
#
# Ports   : host 8029 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/freshrssdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add (all capabilities dropped), explicit TZ, a healthcheck on
#           the only service, and x-app-meta as the last block.
# Wrapper : the official entrypoint needs root (timezone symlink, sed on /etc,
#           chown, Apache pid under /var/run, cron). TOS forbids root
#           containers, so this wrapper runs `cli/prepare.php` and the
#           unmodified FreshRSS app with a private, writable copy of the Apache
#           config as uid 1000 on port 8080.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  freshrssdocker:
    image: freshrss/freshrss:1.31.0
    container_name: freshrssdocker
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # FreshRSS's official entrypoint needs root (timezone symlink, sed on /etc,
        # chown, Apache pid under /var/run, cron). TOS forbids root containers, so run
        # the unmodified app with a private, writable copy of the Apache configuration
        # as uid 1000 on port 8080, and perform the data-directory preparation the
        # official entrypoint does with `cli/prepare.php`.
        set -u

        cd /var/www/FreshRSS

        # The official entrypoint runs `./cli/prepare.php` before Apache (as root).
        # Skipping it leaves data/favicons, data/tokens, data/cache, data/PubSubHubbub
        # and data/users missing: the first-run page then emits "touch(): Unable to
        # create file ..." warnings, the web installer cannot create the administrator,
        # favicons are never cached and the API (token store) stays broken. The script
        # only creates directories and files owned by the application user, so uid 1000
        # can run it; a failure is loud in the container log but never blocks Apache.
        # (`cli/access-permissions.sh` is deliberately NOT called: it refuses to run
        # without root, and there is nothing to chown when we run as the data owner.)
        if ! php -f ./cli/prepare.php >/dev/null; then
        	echo "WARN: cli/prepare.php failed - data directories may be incomplete" >&2
        fi

        rm -rf /tmp/apache2
        mkdir -p /tmp/apache2
        cp -aL /etc/apache2/. /tmp/apache2/ 2>/dev/null || true

        # The upstream ports.conf has Listen commented out and the vhost is *:80.
        grep -q '^Listen 8080' /tmp/apache2/ports.conf || printf '\nListen 8080\n' >> /tmp/apache2/ports.conf
        sed -i 's/<VirtualHost \*:80>/<VirtualHost *:8080>/' /tmp/apache2/sites-enabled/FreshRSS.Apache.conf 2>/dev/null || true
        sed -i 's|/var/run/apache2|/tmp/apache2|g; s|/var/lock/apache2|/tmp/apache2|g; s|/var/log/apache2|/tmp/apache2|g' /tmp/apache2/envvars

        export APACHE_CONFDIR=/tmp/apache2
        export APACHE_ENVVARS=/tmp/apache2/envvars
        . /tmp/apache2/envvars
        export APACHE_RUN_DIR=/tmp/apache2
        export APACHE_LOCK_DIR=/tmp/apache2
        export APACHE_LOG_DIR=/tmp/apache2
        export APACHE_PID_FILE=/tmp/apache2/apache2.pid
        mkdir -p "$$APACHE_RUN_DIR"

        exec apache2 -d /tmp/apache2 -f /tmp/apache2/apache2.conf -D FOREGROUND
    ports:
      - "8029:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/freshrssdocker/data:/var/www/FreshRSS/data
      - /Volume1/DockerAppData/freshrssdocker/extensions:/var/www/FreshRSS/extensions
    healthcheck:
      test: ["CMD-SHELL", "php -r 'if (fsockopen(\"127.0.0.1\",8080)) exit(0); exit(1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8029
    protocol: http
