# ===========================================================================
# FreshRSS for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : freshrss/freshrss:1.30.4 (Docker Hub, used unmodified)
#                  -> https://github.com/FreshRSS/FreshRSS
#
# Ports   : host 8029 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/freshrssdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the official entrypoint needs root (timezone symlink, sed on /etc, chown,
#           Apache pid under /var/run). TOS forbids root containers, so this wrapper runs
#           the unmodified FreshRSS app with a private, writable copy of the Apache config
#           as uid 1000 on port 8080.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  freshrssdocker:
    image: freshrss/freshrss:1.30.4
    container_name: freshrssdocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8029:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/freshrssdocker/data:/var/www/FreshRSS/data
      - /Volume1/DockerAppData/freshrssdocker/extensions:/var/www/FreshRSS/extensions
    healthcheck:
      test: ["CMD-SHELL", "php -r 'if (fsockopen(\"127.0.0.1\",8080)) exit(0); exit(1);'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8029
    protocol: http
